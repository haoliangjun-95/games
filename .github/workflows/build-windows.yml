name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build offline web bundle
        run: npm run build:offline

      - name: Build Windows installer (electron-builder)
        run: npx electron-builder --win --publish never
        env:
          # 使用非镜像源即可，GitHub Actions 网络直连正常
          ELECTRON_MIRROR: ''

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            release/*.exe
          retention-days: 30

      - name: Upload offline web single-file
        uses: actions/upload-artifact@v4
        with:
          name: offline-web
          path: dist-offline/index.html
          retention-days: 30
